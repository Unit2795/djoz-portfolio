name: Manual Terraform Destroy

# Shared with the deploy workflow so only one Terraform run touches the state at a time. In-progress runs are NOT interrupted
# Runs started meanwhile wait and run in the order they were started (up to 100 waiting), instead of the newest replacing the waiting one
concurrency:
  group: terraform
  cancel-in-progress: false
  queue: max

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type "DESTROY" to confirm infrastructure deletion'
        required: true
        type: string

permissions:
  id-token: write # This is required for requesting the AWS OIDC JWT
  contents: read # This is required for actions/checkout and AWS OIDC JWT

jobs:
  terraform_destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Additional safety check
    if: github.event.inputs.confirm_destroy == 'DESTROY'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Terraform zips the built Lambda files even when destroying, so they must be built first
      # We must ensure PNPM is installed before Node.js https://github.com/actions/setup-node/issues/530#issuecomment-1169317505
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest # package.json only sets a minimum pnpm version
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm ci:install

      - name: Build Lambda Functions
        run: pnpm lambda:build

      # Learn more about AWS OIDC here: https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_IAM_ROLE_NAME }}
          role-session-name: djoz-portfolio-session
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.16" # Latest 1.x, matches required_version in main.tf

      - name: Initialize and Destroy Terraform
        working-directory: ./terraform
        run: |
          terraform init -backend-config=state.config
          terraform destroy -auto-approve -input=false -lock-timeout=5m

      # Assuming the Terraform destroy was successful, clean up the CloudFormation stack used for the TF state backend
      - name: Destroy CloudFormation TF State Backend
        if: ${{ success() }}
        working-directory: ./terraform/bootstrap
        run: |
          chmod +x ./delete-stack.sh
          ./delete-stack.sh
