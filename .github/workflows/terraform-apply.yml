name: Build and Deploy

# Shared with the destroy workflow so only one Terraform run touches the state at a time. In-progress runs are NOT interrupted, to prevent half-deployed infrastructure and corrupted Terraform state
# Runs started meanwhile wait and run in the order they were started (up to 100 waiting), instead of the newest replacing the waiting one
concurrency:
  group: terraform
  cancel-in-progress: false
  queue: max

on:
  push:
    branches: ["main"] # Trigger on push to main branch
    paths-ignore: ["docs/**", "**.md"] # Docs-only pushes don't deploy, run the workflow manually to redeploy
  workflow_dispatch: # Allow manual triggering (for disabling in the template repo)

permissions:
  id-token: write # This is required for requesting the AWS OIDC JWT
  contents: read # This is required for actions/checkout and AWS OIDC JWT

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Adjust this as necessary based on expected deployment time

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # We must ensure PNPM is installed before Node.js https://github.com/actions/setup-node/issues/530#issuecomment-1169317505
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest # package.json only sets a minimum pnpm version
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "latest"
          cache: pnpm

      - name: Install Dependencies
        working-directory: .
        run: pnpm ci:install

      # Terraform zips the built Lambda files, so they must be built first
      - name: Build Lambda Functions
        working-directory: .
        run: pnpm lambda:build

      # Learn more about AWS OIDC here: https://docs.github.com/en/actions/security-for-github-actions/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_IAM_ROLE_NAME }}
          role-session-name: djoz-portfolio-session
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Setup Terraform State Backend
        working-directory: ./terraform/bootstrap
        run: |
          chmod +x ./bootstrap-state.sh
          ./bootstrap-state.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "^1.16" # Latest 1.x, matches required_version in main.tf

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -backend-config=state.config

      # Runs before the client deploy, so new Lambdas and infrastructure are live before the new client
      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply -auto-approve -input=false -lock-timeout=5m

          # Export Terraform outputs as GitHub environment variables
          echo "S3_BUCKET_NAME=$(terraform output -raw s3_bucket_name)" >> $GITHUB_ENV
          echo "CLOUDFRONT_DIST_ID=$(terraform output -raw cloudfront_distribution_id)" >> $GITHUB_ENV

      - name: Build Client
        working-directory: .
        run: pnpm client:build

      - name: Upload to S3 and invalidate CloudFront
        working-directory: ./client
        run: |
          # Upload to S3 bucket
          aws s3 sync ./dist s3://${{ env.S3_BUCKET_NAME }} --delete

          # Create CloudFront invalidation
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_ID }} \
            --paths "/*"
